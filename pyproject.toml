[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudosql"
version = "1.0.0"
description = "Compilador del Pseudolenguaje PostgreSQL -> SQL (PostgreSQL), implementado con Lark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lark>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pseudosql = "pseudosql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pseudosql.parsing" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
